<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>DinoEntreno</title>
<!-- para instalarla en el iPhone desde Safari («Agregar a inicio») -->
<meta name="theme-color" content="#131211">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DinoEntreno">
<link rel="apple-touch-icon" href="iconos/icono-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="estilos.css">
<script>/* el tema va antes de pintar, para que no parpadee */
try { var t = localStorage.getItem('dinosaurio.tema'); if (t && t !== 'hierro') document.documentElement.dataset.tema = t; } catch (e) {}</script>
</head>
<body>
<!-- ============ inicio ============ -->
<div id="app">
  <header class="cabeza">
    <div class="marca">
      <span class="logo" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M3 13h3v6H3zM26 13h3v6h-3zM7 10h3v12H7zM22 10h3v12h-3zM11 15h10v2H11z" fill="currentColor"/></svg></span>
      <h1>DinoEntreno</h1>
    </div>
    <button class="engranaje reloj-boton" id="b-reloj" aria-label="Temporizador"><svg viewBox="0 0 24 24"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 9.5v4l2.5 2M9.5 3h5M12 3v3M18.5 6.5l1.5-1.5"/></svg><span id="b-tiempo"></span></button>
    <button class="engranaje" id="b-ajustes" aria-label="Ajustes"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    <p class="frase" id="frase"></p>
  </header>

  <main>
    <section class="vista" id="v-hoy" data-titulo="Hoy"></section>
    <section class="vista" id="v-registrar" data-titulo="Registrar" hidden></section>
    <section class="vista" id="v-libro" data-titulo="Entreno dinosaurio" hidden></section>
    <section class="vista" id="v-crossfit" data-titulo="CrossFit" hidden></section>
    <section class="vista" id="v-historial" data-titulo="Historial" hidden></section>
    <section class="vista" id="v-guia" data-titulo="Guía" hidden></section>
    <section class="vista" id="v-baraja" data-titulo="Baraja" hidden></section>
  </main>

  <nav class="navegacion" id="navegacion">
    <button data-vista="hoy" class="activa"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></svg><span>Hoy</span></button>
    <button data-vista="registrar"><svg viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/></svg><span>Registrar</span></button>
    <button data-vista="historial"><svg viewBox="0 0 24 24"><path d="M12 7v5l3 3M3.5 12a8.5 8.5 0 1 0 2.5-6M3 4v4h4"/></svg><span>Historial</span></button>
    <button data-vista="guia"><svg viewBox="0 0 24 24"><path d="M5 4h10l4 4v12H5zM9 12h6M9 16h6M9 8h3"/></svg><span>Guía</span></button>
    <button data-vista="libro" class="dos-lineas tipo"><svg viewBox="0 0 24 24"><path fill="currentColor" stroke="none" fill-rule="evenodd" d="M1.5 14.2C4 13.4 6.5 11.6 9 10.4c1.2-.6 2.4-1.4 3.2-2.6l1-2.4c.4-1 1.3-1.6 2.4-1.6h5c.8 0 1.4.6 1.4 1.4v1.2h-2.8v.8H21V8c0 .6-.5 1-1.1 1h-3c-.6 0-1 .4-1.1 1l-.2 1.4 1.7 1-.3.6-1.6-.7c-.2 1.1-.8 2.1-1.6 2.7l.6 3.8 2 .8v.8h-3l-1-4.6h-1.1l-.7 3.1 1.6.8v.7H9.4l.2-4.4c-2-.6-5.1-1-8.1-1.8zM17.6 4.7a.65.65 0 1 0 .01 0z"/></svg><span>Entreno dinosaurio</span></button>
    <button data-vista="crossfit" class="tipo"><svg viewBox="0 0 24 24"><path d="M8.6 8.2a3.4 3.4 0 0 1 6.8 0"/><path d="M8.1 8.2h7.8"/><circle cx="12" cy="14.2" r="6"/><path d="M9.8 20h4.4"/></svg><span>CrossFit</span></button>
    <button data-vista="baraja" class="tipo"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="11" height="15" rx="2"/><path d="M9 3.5h9a2 2 0 0 1 2 2V17"/><path d="M9.5 10.5c0-1 .8-1.6 1.5-1.6.7 0 1.5.6 1.5 1.6 0 1.3-1.5 2.4-1.5 2.4s-1.5-1.1-1.5-2.4z"/></svg><span>Baraja</span></button>
  </nav>
</div>

<div class="hoja" id="hoja" hidden>
  <div class="hoja-cuerpo" id="hoja-cuerpo"></div>
</div>

<div class="dialogo" id="dialogo" hidden>
  <div class="dialogo-caja" role="dialog" aria-modal="true">
    <p id="dialogo-texto"></p>
    <div class="dialogo-botones">
      <button class="boton sobrio" id="dialogo-no">Cancelar</button>
      <button class="boton peligro" id="dialogo-si">Borrar</button>
    </div>
  </div>
</div>

<div class="juego" id="juego" hidden></div>
<div class="visor" id="visor" hidden></div>
<div class="reloj" id="reloj" hidden></div>
<div class="aviso-flotante" id="aviso" hidden></div>
<!-- ============ fin ============ -->
<script src="datos.js"></script>
<script src="programas.js"></script>
<script src="motor.js"></script>
<script src="ejecucion.js"></script>
<script src="figuras.js"></script>
<script src="app.js"></script>
<script src="reloj.js"></script>
<script src="baraja.js"></script>
<script src="wods.js"></script>
<script src="crossfit.js"></script>
</body>
</html>
